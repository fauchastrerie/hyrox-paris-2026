  <script>
    // Thème posé avant le premier affichage : sombre par défaut, sinon le choix fait dans Repères (Clair, ou Comme le téléphone).
    (function () {
      var choix = 'sombre';
      try { choix = localStorage.getItem('hyrox-paris-2026:theme') || 'sombre'; } catch (e) {}
      var sombre = choix !== 'clair' && (choix !== 'auto' || matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.dataset.theme = sombre ? 'sombre' : 'clair';
      document.querySelector('meta[name="theme-color"]').content = sombre ? '#0e1013' : '#f5f5f2';
    })();
  </script>
